version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - misspell

  settings:
    depguard:
      # errs -> schema and schema -> config are cycles the compiler rejects
      # before depguard runs. The rules stay as documentation of the graph.
      rules:
        ids-is-a-leaf:
          files:
            - "**/internal/ids/**"
            - "!$test"
          deny:
            - pkg: github.com/punk-raven/dafter/go/internal/errs
              desc: ids depends on nothing
            - pkg: github.com/punk-raven/dafter/go/internal/schema
              desc: ids depends on nothing
            - pkg: github.com/punk-raven/dafter/go/internal/events
              desc: ids depends on nothing
            - pkg: github.com/punk-raven/dafter/go/internal/config
              desc: ids depends on nothing

        errs-is-a-leaf:
          files:
            - "**/internal/errs/**"
            - "!$test"
          deny:
            - pkg: github.com/punk-raven/dafter/go/internal/schema
              desc: errs depends on nothing; schema depends on errs
            - pkg: github.com/punk-raven/dafter/go/internal/events
              desc: errs depends on nothing
            - pkg: github.com/punk-raven/dafter/go/internal/config
              desc: errs depends on nothing

        schema-depends-on-errs-only:
          files:
            - "**/internal/schema/**"
            - "!$test"
          deny:
            - pkg: github.com/punk-raven/dafter/go/internal/events
              desc: schema is below events; an import here closes a cycle
            - pkg: github.com/punk-raven/dafter/go/internal/config
              desc: schema is below config; an import here closes a cycle

        events-and-config-do-not-know-each-other:
          files:
            - "**/internal/events/**"
            - "!$test"
          deny:
            - pkg: github.com/punk-raven/dafter/go/internal/config
              desc: events and config are siblings; shared types belong lower

        config-does-not-import-events:
          files:
            - "**/internal/config/**"
            - "!$test"
          deny:
            - pkg: github.com/punk-raven/dafter/go/internal/events
              desc: events and config are siblings; shared types belong lower

        state-depends-on-core-only:
          files:
            - "**/internal/state/**"
            - "!$test"
          deny:
            - pkg: github.com/punk-raven/dafter/go/internal/transport
              desc: state and transport are siblings under control
            - pkg: github.com/punk-raven/dafter/go/internal/turn
              desc: state and turn are siblings under control
            - pkg: github.com/punk-raven/dafter/go/internal/control
              desc: control depends on state, never the other way round

        transport-depends-on-core-only:
          files:
            - "**/internal/transport/**"
            - "!$test"
          deny:
            - pkg: github.com/punk-raven/dafter/go/internal/state
              desc: state and transport are siblings under control
            - pkg: github.com/punk-raven/dafter/go/internal/turn
              desc: transport and turn are siblings under control
            - pkg: github.com/punk-raven/dafter/go/internal/control
              desc: control depends on transport, never the other way round

        turn-depends-on-nothing:
          files:
            - "**/internal/turn/**"
            - "!$test"
          deny:
            - pkg: github.com/punk-raven/dafter/go/internal/state
              desc: turn is a leaf; it depends on no internal package
            - pkg: github.com/punk-raven/dafter/go/internal/transport
              desc: turn is a leaf; it depends on no internal package
            - pkg: github.com/punk-raven/dafter/go/internal/control
              desc: turn is a leaf; it depends on no internal package
            - pkg: github.com/punk-raven/dafter/go/internal/config
              desc: turn is a leaf; it depends on no internal package
            - pkg: github.com/punk-raven/dafter/go/internal/errs
              desc: turn is a leaf; it depends on no internal package
            - pkg: github.com/punk-raven/dafter/go/internal/schema
              desc: turn is a leaf; it depends on no internal package
            - pkg: github.com/punk-raven/dafter/go/internal/events
              desc: turn is a leaf; it depends on no internal package
            - pkg: github.com/punk-raven/dafter/go/internal/ids
              desc: turn is a leaf; it depends on no internal package

        core-sits-below-everything:
          files:
            - "**/internal/ids/**"
            - "**/internal/errs/**"
            - "**/internal/schema/**"
            - "**/internal/events/**"
            - "**/internal/config/**"
            - "!$test"
          deny:
            - pkg: github.com/punk-raven/dafter/go/internal/state
              desc: state depends on core, never the other way round
            - pkg: github.com/punk-raven/dafter/go/internal/transport
              desc: transport depends on core, never the other way round
            - pkg: github.com/punk-raven/dafter/go/internal/turn
              desc: turn depends on core, never the other way round
            - pkg: github.com/punk-raven/dafter/go/internal/control
              desc: control depends on core, never the other way round

        no-vendor-sdks:
          files:
            - "$all"
          deny:
            - pkg: github.com/livekit/server-sdk-go
              desc: the media server SDK belongs behind the transport package, nowhere else

        media-server-stays-behind-the-seam:
          files:
            - "$all"
            - "!**/internal/transport/**"
          deny:
            - pkg: github.com/livekit/protocol
              desc: the media server's own types belong behind the transport package, nowhere else

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
