[project]
name = "dafter-providers"
version = "0.0.0"
description = "Vendor adapters behind the stage contracts, one subpackage per vendor"
requires-python = ">=3.11"
dependencies = [
    "dafter-core",
    "livekit-agents==1.8.3",
    "livekit-plugins-sarvam==1.8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dafter_providers"]

[tool.hatch.build.targets.wheel.force-include]
"src/dafter_providers/py.typed" = "dafter_providers/py.typed"
