[project]
name = "dafter-scribe"
version = "0.0.0"
description = "The silent scribe: a hidden second agent that reads the live captions and keeps the call's notes, scores and minutes"
requires-python = ">=3.11"
dependencies = [
    "dafter-core",
    "dafter-providers",
    "dafter-runtime",
    "dafter-evals",
    "dafter-batch",
    "aiohttp>=3.9",
    "livekit-agents==1.8.3",
]

[project.scripts]
dafter-scribe = "dafter_scribe.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dafter_scribe"]

[tool.hatch.build.targets.wheel.force-include]
"src/dafter_scribe/py.typed" = "dafter_scribe/py.typed"
