[project]
name = "dafter-workspace"
version = "0.0.0"
description = "Dafter agent plane, providers, batch pass and evals"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.sources]
dafter-core = { workspace = true }
dafter-providers = { workspace = true }
dafter-runtime = { workspace = true }
dafter-evals = { workspace = true }
dafter-batch = { workspace = true }
dafter-scribe = { workspace = true }

[tool.uv.workspace]
members = [
    "dafter_core",
    "dafter_providers",
    "dafter_runtime",
    "dafter_evals",
    "dafter_batch",
    "dafter_scribe",
]

[dependency-groups]
dev = [
    "dafter-core",
    "dafter-providers",
    "dafter-runtime",
    "dafter-evals",
    "dafter-batch",
    "dafter-scribe",
    "pytest>=8",
    "ruff>=0.9",
    "mypy>=1.11",
    "types-jsonschema",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/enums.py", "**/_schemas/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "N"]

[tool.ruff.lint.isort]
known-third-party = [
    "dafter_core",
    "dafter_providers",
    "dafter_runtime",
    "dafter_evals",
    "dafter_batch",
    "dafter_scribe",
]

[tool.pytest.ini_options]
addopts = "-m 'not llm_judge'"
markers = [
    "llm_judge: calls a real LLM and judges the reply with it; deselected by default, run with `pytest -m llm_judge` and SARVAM_API_KEY set, which spends provider credits",
]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:livekit.rtc.event_emitter",
]
testpaths = [
    "dafter_core/tests",
    "dafter_providers/tests",
    "dafter_runtime/tests",
    "dafter_evals/tests",
    "dafter_batch/tests",
    "dafter_scribe/tests",
]
pythonpath = [
    "dafter_core/src",
    "dafter_providers/src",
    "dafter_runtime/src",
    "dafter_evals/src",
    "dafter_batch/src",
    "dafter_scribe/src",
]

[tool.mypy]
strict = true
files = [
    "dafter_core/src",
    "dafter_core/tests",
    "dafter_providers/src",
    "dafter_providers/tests",
    "dafter_runtime/src",
    "dafter_runtime/tests",
    "dafter_evals/src",
    "dafter_evals/tests",
    "dafter_batch/src",
    "dafter_batch/tests",
    "dafter_scribe/src",
    "dafter_scribe/tests",
]
mypy_path = "dafter_core/src:dafter_providers/src:dafter_runtime/src:dafter_evals/src:dafter_batch/src:dafter_scribe/src"

[[tool.mypy.overrides]]
module = "referencing.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dafter_core.enums"
disable_error_code = ["explicit-any"]
