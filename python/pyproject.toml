[project]
name = "dafter-workspace"
version = "0.0.0"
description = "Dafter agent plane, providers, batch pass and evals"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.sources]
dafter-core = { workspace = true }
dafter-providers = { workspace = true }
dafter-runtime = { workspace = true }
dafter-evals = { workspace = true }

[tool.uv.workspace]
members = ["dafter_core", "dafter_providers", "dafter_runtime", "dafter_evals"]

[dependency-groups]
dev = [
    "dafter-core",
    "dafter-providers",
    "dafter-runtime",
    "dafter-evals",
    "pytest>=8",
    "ruff>=0.9",
    "mypy>=1.11",
    "types-jsonschema",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/enums.py", "**/_schemas/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-third-party = ["dafter_core", "dafter_providers", "dafter_runtime", "dafter_evals"]

[tool.pytest.ini_options]
testpaths = [
    "dafter_core/tests",
    "dafter_providers/tests",
    "dafter_runtime/tests",
    "dafter_evals/tests",
]
pythonpath = [
    "dafter_core/src",
    "dafter_providers/src",
    "dafter_runtime/src",
    "dafter_evals/src",
]

[tool.mypy]
strict = true
files = [
    "dafter_core/src",
    "dafter_core/tests",
    "dafter_providers/src",
    "dafter_providers/tests",
    "dafter_runtime/src",
    "dafter_runtime/tests",
    "dafter_evals/src",
    "dafter_evals/tests",
]
mypy_path = "dafter_core/src:dafter_providers/src:dafter_runtime/src:dafter_evals/src"

[[tool.mypy.overrides]]
module = "referencing.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dafter_core.enums"
disable_error_code = ["explicit-any"]
