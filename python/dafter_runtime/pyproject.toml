[project]
name = "dafter-runtime"
version = "0.0.0"
description = "The agent worker: registers as a pool and runs the pipeline the resolved config describes"
requires-python = ">=3.11"
dependencies = [
    "dafter-core",
    "dafter-providers",
    "aiohttp>=3.9",
    "livekit-agents==1.8.3",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.scripts]
dafter-runtime = "dafter_runtime.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dafter_runtime"]

[tool.hatch.build.targets.wheel.force-include]
"src/dafter_runtime/py.typed" = "dafter_runtime/py.typed"
