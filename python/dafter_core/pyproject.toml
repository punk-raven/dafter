[project]
name = "dafter-core"
version = "0.0.0"
description = "The shared contract: types generated from schemas/, and the schemas themselves"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20", "rfc3339-validator>=0.1.4", "rfc8785>=0.1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dafter_core"]

# py.typed is what makes the annotations visible to a consumer's type checker.
# Without it PEP 561 says treat the package as untyped, and every generated
# annotation is ignored downstream.
[tool.hatch.build.targets.wheel.force-include]
"src/dafter_core/py.typed" = "dafter_core/py.typed"
