[project]
name = "dafter-core"
version = "0.0.0"
description = "Generated types, the resolved-config reader and the event envelope"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dafter_core"]
