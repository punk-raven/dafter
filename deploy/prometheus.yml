global:
  scrape_interval: 5s

scrape_configs:
  - job_name: dafter-control
    static_configs:
      - targets: ["control:8080"]
  # LiveKit only serves /metrics on prometheus.port (deploy/livekit.yaml);
  # on the API port 7880 the path is a 404, so the old livekit:7880 target
  # never produced a sample.
  - job_name: livekit
    static_configs:
      - targets: ["livekit:6789"]
  # The agent worker runs on the host network, so it is reached through the
  # host gateway. It serves /metrics from the framework's own Prometheus server
  # (DAFTER_METRICS_PORT), aggregating every job process.
  - job_name: dafter-agent
    static_configs:
      - targets: ["host.docker.internal:9464"]
