global:
  scrape_interval: 5s

scrape_configs:
  - job_name: dafter-control
    static_configs:
      - targets: ["control:8080"]
  # LiveKit only serves /metrics on prometheus.port (deploy/livekit.yaml);
  # on the API port 7880 the path is a 404, so the old livekit:7880 target
  # never produced a sample.
  - job_name: livekit
    static_configs:
      - targets: ["livekit:6789"]
  # The agent worker runs on the host network, so it is reached at the gateway
  # of the compose network, pinned to 10.213.0.1 in docker-compose.yml: that
  # address is the host network namespace on native Linux and on Docker
  # Desktop alike, where host.docker.internal is the desktop machine instead
  # and refuses the connection. The worker serves /metrics from the
  # framework's own Prometheus server (DAFTER_METRICS_PORT) on every
  # interface, aggregating every job process.
  - job_name: dafter-agent
    static_configs:
      - targets: ["10.213.0.1:9464"]
