name: evals

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - python/dafter_runtime/src/dafter_runtime/personas.py
      - python/dafter_runtime/src/dafter_runtime/guardrails.py
      - python/dafter_evals/**
      - go/cmd/dafter-control/catalog.json
      - testdata/scenarios/**
      - testdata/redteam/**
      - testdata/asr/**
      - testdata/agent/**
      - Makefile
      - .github/workflows/evals.yml
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      languages:
        description: "space-separated languages: hi en-IN kn-IN mr-IN te-IN"
        default: "hi en-IN kn-IN mr-IN te-IN"
      text_max_inr:
        description: "cap in INR for the scenario suite"
        default: "450"
      live:
        description: "also run the live, TTS and scorecard job against a dev stack"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: evals-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'run-evals' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"
  EVALS_LANGUAGES: ${{ inputs.languages || 'hi en-IN kn-IN mr-IN te-IN' }}
  TEXT_MAX_INR: ${{ inputs.text_max_inr || '450' }}

jobs:
  offline:
    name: eval package, no provider calls
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.13"
      - run: make evals-offline

  credentials:
    name: provider credentials present
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'run-evals') && (github.event.action != 'labeled' || github.event.label.name == 'run-evals'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      llm: ${{ steps.present.outputs.llm }}
      asr: ${{ steps.present.outputs.asr }}
    steps:
      - id: present
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          llm=false; asr=false
          if [ -n "$SARVAM_API_KEY" ] && [ -n "$GEMINI_API_KEY" ]; then llm=true; fi
          if [ -n "$SARVAM_API_KEY" ] && [ -n "$HF_TOKEN" ]; then asr=true; fi
          echo "llm=$llm" >> "$GITHUB_OUTPUT"
          echo "asr=$asr" >> "$GITHUB_OUTPUT"
          [ "$llm" = true ] || echo "::notice::SARVAM_API_KEY or GEMINI_API_KEY is not set; text and red-team evals skip"
          [ "$asr" = true ] || echo "::notice::SARVAM_API_KEY or HF_TOKEN is not set; ASR evals skip"

  text:
    name: text gates (screen, pass^k scenarios)
    needs: credentials
    if: needs.credentials.outputs.llm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.13"
      - name: screen and scenarios, exit 1 under pass^k, tool success or read-back accuracy
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: make evals-text
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evals-text
          path: build/evals
          if-no-files-found: ignore
          retention-days: 30

  redteam:
    name: red-team bank (pass rate at least 99%)
    needs: credentials
    if: needs.credentials.outputs.llm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.13"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROMPTFOO_DISABLE_TELEMETRY: "1"
        run: make evals-redteam
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evals-redteam
          path: build/evals
          if-no-files-found: ignore
          retention-days: 30

  asr:
    name: asr (exit 1 on a baseline regression)
    needs: credentials
    if: needs.credentials.outputs.asr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.13"
      - name: cache the fetched public clips
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: testdata/asr/audio
          key: asr-audio-${{ hashFiles('testdata/asr/*.json') }}
      - env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make evals-asr
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evals-asr
          path: build/evals
          if-no-files-found: ignore
          retention-days: 30

  live:
    name: nightly live agent, sweeps and TTS
    needs: credentials
    if: needs.credentials.outputs.llm == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.13"
      - name: start the dev stack
        run: |
          docker compose up -d --build
          curl -fsS -o /dev/null --retry 30 --retry-connrefused --retry-delay 5 http://127.0.0.1:8080/
      - name: live agent per language and sweeps
        run: make evals-live
      - name: tts round trip, exit 1 on a baseline regression
        if: ${{ !cancelled() }}
        run: make evals-tts
      - name: stack logs on failure
        if: failure()
        run: mkdir -p build/evals && docker compose logs --no-color --tail 500 > build/evals/compose.log 2>&1
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evals-live
          path: build/evals
          if-no-files-found: ignore
          retention-days: 30
      - if: always()
        run: docker compose down -v

  scorecard:
    name: scorecard
    needs: [asr, live]
    if: always() && (needs.asr.result == 'success' || needs.asr.result == 'failure' || needs.live.result == 'success' || needs.live.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evals-{asr,live}
          path: build/evals
          merge-multiple: true
      - run: make evals-scorecard
      - run: cat build/evals/scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evals-scorecard
          path: |
            build/evals/scorecard.json
            build/evals/scorecard.md
          retention-days: 30
