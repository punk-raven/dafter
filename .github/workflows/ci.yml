name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"

jobs:
  generated:
    name: generated output is not committed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make generate-check
      - name: the check rejects a generated file that was committed anyway
        run: |
          sentinel=go/internal/config/zz_selftest_gen.go
          : > "$sentinel"
          git add -f "$sentinel"
          if make generate-check; then
            echo "generate-check accepted $sentinel; the check has stopped working"
            exit 1
          fi
          git rm -qf "$sentinel"

  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            go/tools/golangci/go.sum
      - name: cache the linter binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: go/bin
          key: golangci-${{ runner.os }}-${{ hashFiles('go/tools/golangci/go.sum') }}
      - run: make vet lint test

  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.11, so every version we claim gets exercised.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: ${{ matrix.python }}
      - run: make py-lint py-test

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            go/tools/govulncheck/go.sum
      - name: cache the scanner binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: go/bin
          key: govulncheck-${{ runner.os }}-${{ hashFiles('go/tools/govulncheck/go.sum') }}
      # Reports only vulnerabilities on a reachable call path, so it is a
      # finding rather than a dependency-graph alert nobody acts on.
      - run: make vulncheck
